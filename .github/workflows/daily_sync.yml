name: Daily MF Sync + AI Analysis

on:
  schedule:
    # GitHub drops or delays scheduled runs under load (worst at the top of the
    # hour). So: one run shortly after D1's daily write quota resets at 00:00 UTC
    # (off the :00/:05 peak), plus a backup two hours later. The 'guard' job skips
    # the backup when a run already succeeded or is running in the last 16 hours.
    - cron: '23 0 * * *'   # 05:53 AM IST
    - cron: '47 2 * * *'   # 08:17 AM IST (backup)
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-mf-sync
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u -d '16 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/daily_sync.yml/runs?per_page=30&created=>=$since" \
            --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.status != "completed" or .conclusion == "success")] | length')
          echo "recent runs: $n"
          if [ "${n:-0}" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

  daily-run:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150   # all active schemes (~15-20k) instead of equity/hybrid only

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: github-actions/requirements.txt

      - name: Install dependencies
        run: pip install -r github-actions/requirements.txt

      - name: Step 1 — Sync MF data (async, ~15 min)
        env:
          CF_ACCOUNT_ID:  ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN:   ${{ secrets.CF_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: python github-actions/scripts/sync_mf_data.py

      - name: Step 2 — AI analysis (Tier 1 scoring + Tier 2 verdicts)
        env:
          CF_ACCOUNT_ID:     ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN:      ${{ secrets.CF_API_TOKEN }}
          D1_DATABASE_ID:    ${{ secrets.D1_DATABASE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Set to "true" to run free Tier-1 scoring only (no Claude calls).
          # Set to "false" once credits are topped up to enable written verdicts.
          SKIP_TIER2:        "true"
          # Scoring engine used for the live signal: "1" (returns only) or "2"
          # (adds Sharpe, Sortino, drawdown, consistency). Both are always stored
          # side by side. Set the repo variable ENGINE_VERSION to 2 or 3 to go live.
          ENGINE_VERSION:    ${{ vars.ENGINE_VERSION || '1' }}
          # Optional overrides (defaults shown):
          # VERDICT_STALE_DAYS: "14"
          # MAX_FUNDS:          "2000"
          # BATCH_SIZE:         "15"
        run: python github-actions/scripts/ai_analysis.py

      # Step 3 (Gmail email digest) removed 2026-11-23.
      # Email is moving to Resend; digest generation is paused until then.
