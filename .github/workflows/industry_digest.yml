name: Industry digest emails

on:
  schedule:
    - cron: '0 4 * * *'    # 9:30 AM IST daily; weekly subscribers are sent on Mondays
  workflow_dispatch:
    inputs:
      only:
        description: 'Send only to this email (test)'
        required: false
      dry_run:
        description: 'Dry run (no emails sent)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: github-actions/requirements.txt
      - run: pip install -r github-actions/requirements.txt
      - name: Collect industry news
        env:
          CF_ACCOUNT_ID:  ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN:   ${{ secrets.CF_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: python github-actions/scripts/fetch_industry_news.py
      - name: Send digest emails
        env:
          CF_ACCOUNT_ID:        ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN:         ${{ secrets.CF_API_TOKEN }}
          D1_DATABASE_ID:       ${{ secrets.D1_DATABASE_ID }}
          RESEND_API_KEY:       ${{ secrets.RESEND_API_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EMAIL_FROM:           ${{ secrets.EMAIL_FROM }}
          ONLY_EMAIL:           ${{ github.event.inputs.only }}
          DRY_RUN:              ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=""
          if [ -n "$ONLY_EMAIL" ]; then ARGS="$ARGS --only $ONLY_EMAIL"; fi
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python github-actions/scripts/send_digest_emails.py $ARGS
